services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN:-}
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=appmuscu
      - POSTGRES_PASSWORD=appmuscu
      - POSTGRES_DB=appmuscu
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appmuscu"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
